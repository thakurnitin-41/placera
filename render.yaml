services:
  - type: web
    name: placera-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placera-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
databases:
  - name: placera-postgres
    databaseName: placera
    user: placera
